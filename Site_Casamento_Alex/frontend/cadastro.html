<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/cadastro.css">
<link rel="icon" href="data:image/svg+xml,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
    <text y='0.9em' font-size='90'>💑</text>
  </svg>">

<title>Cadastro | Casamento</title>

</head>

<body>

<div class="card">

<div class="brand">
<div class="dot"></div>
<span>Casamento</span>
</div>

<h1>Criar Conta</h1>

<p class="sub">
Cadastre-se para acessar sua área de convidado.
</p>

<form id="cadastroForm">

<label>Nome Completo</label>
<input
type="text"
id="nome"
required
>

<label>Email</label>
<input
type="email"
id="email"
required
>

<label>Senha</label>
<input
type="password"
id="senha"
required
>

<button type="submit">
Criar Conta
</button>

<div id="mensagem" class="mensagem"></div>

</form>

</div>

<script src="js/cadastro.js"></script>

</body>
</html>

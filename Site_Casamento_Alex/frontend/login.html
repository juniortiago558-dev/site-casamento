<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/login.css">
<link rel="icon" href="data:image/svg+xml,
  <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
    <text y='0.9em' font-size='90'>💑</text>
  </svg>">
<title>Login | Casamento</title>

</head>

<body>

<div class="login-card">

<div class="brand">
<div class="dot"></div>
<span>Casamento</span>
</div>

<h1>Bem-vindo</h1>

<p class="sub">
Faça login para confirmar presença e reservar presentes.
</p>

<form id="loginForm">

<label>Email</label>
<input
type="email"
id="email"
required
>

<label>Senha</label>
<input
type="password"
id="senha"
required
>

<button type="submit">
Entrar
</button>

<div id="mensagem" class="mensagem"></div>

</form>

<div class="link">
Não possui conta?
<a href="cadastro.html">
Cadastre-se
</a>
</div>

</div>

<script src="js/login.js"></script>

</body>
</html>
